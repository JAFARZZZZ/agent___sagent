<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#E8336B">
  <title>تربچه · دستیار خرید حضوری</title>
  <link rel="icon" href="assets/mascot.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app" id="app" data-view="chat">
  <section class="chat-pane" aria-label="گفتگو">
    <header class="topbar">
      <div class="brand">
        <span class="logo" id="logo"></span>
        <div>
          <h1>تربچه</h1>
          <p>دستیار خرید حضوری از فروشگاه‌های تهران</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn mobile-only" id="toMap" type="button" aria-label="نمایش نقشه">
          <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 0v14m6-12v14"/></svg>
          <span class="badge" id="mapBadge" hidden></span>
        </button>
        <button class="icon-btn" id="newChat" type="button" aria-label="گفتگوی جدید" title="گفتگوی جدید">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="تغییر تم" title="تم روشن/تیره">
          <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </header>

    <ol class="steps" id="steps" aria-label="مراحل خرید">
      <li data-step="1"><b>۱</b><span>انتخاب کالا</span></li>
      <li data-step="2"><b>۲</b><span>محدوده</span></li>
      <li data-step="3"><b>۳</b><span>مقایسه</span></li>
      <li data-step="4"><b>۴</b><span>هماهنگی</span></li>
    </ol>

    <div class="prefbar" id="prefbar" aria-label="شرایط خرید"></div>

    <main class="thread" id="thread" aria-live="polite"></main>

    <div class="compare-tray" id="compareTray" hidden></div>

    <form class="composer" id="composer" autocomplete="off">
      <div class="suggest" id="suggest"></div>
      <div class="input-row">
        <textarea id="input" rows="1" maxlength="2000" placeholder="بگو دنبال چی هستی… مثلاً «هدفون بی‌سیم تا ۳ میلیون نزدیک جمهوری»"></textarea>
        <button class="send" id="send" type="submit" aria-label="ارسال">
          <svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
        </button>
      </div>
    </form>
  </section>

  <section class="map-pane" aria-label="نقشه">
    <div id="map"></div>
    <div class="map-head" id="mapHead"></div>
    <div class="map-legend">
      <span><i class="dot open"></i>باز</span>
      <span><i class="dot unknown"></i>ساعت نامشخص</span>
      <span><i class="dot closed"></i>بسته</span>
    </div>
    <div class="map-fabs">
      <button class="fab" id="locateBtn" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/><circle cx="12" cy="12" r="7"/></svg><span>موقعیت من</span></button>
      <button class="fab mobile-only" id="toChat" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4V5Z"/></svg><span>گفتگو</span></button>
    </div>
    <div class="pick-hint" id="pickHint" hidden>روی نقشه بزن تا موقعیتت ثبت بشه <button type="button" data-act="cancel-pick">انصراف</button></div>
  </section>

  <aside class="sheet" id="sheet" aria-modal="true" role="dialog" hidden>
    <div class="sheet-card">
      <button class="icon-btn sheet-close" type="button" data-act="close-sheet" aria-label="بستن"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </aside>
  <div class="popover" id="popover" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>
</div>
<script src="vendor/leaflet.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
